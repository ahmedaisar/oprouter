name: Release validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  comprehensive:
    name: Comprehensive release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Gateway integration tests
        run: npm run test:integration
      - name: Production build
        run: npm run build
